<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" role="img" aria-labelledby="G07-title G07-desc"><title id="G07-title">Neun Chancenfelder, drei Arbeitsstränge</title><desc id="G07-desc">Redaktionelle Gruppierung bestehender Chancenfelder · keine neue Bewertung</desc><rect width="1000" height="380" fill="#fff"/><style>text{font-family:Arial,sans-serif;fill:#18332d}.sub{font-size:15px;fill:#485e57}.label{font-size:17px}.value{font-size:18px;font-weight:700}</style><text x="32" y="38" font-size="23" font-weight="700">Neun Chancenfelder, drei Arbeitsstränge</text><text x="32" y="65" class="sub">Redaktionelle Gruppierung bestehender Chancenfelder · keine neue Bewertung</text><rect x="32" y="105" width="285" height="148" rx="4" fill="#edf4f0"/><text x="50" y="139" class="value">A</text><text x="50" y="181" class="label">Besuch aktivieren</text><text x="50" y="220" class="sub">Felder 1 · 2 · 6</text><rect x="357" y="105" width="285" height="148" rx="4" fill="#edf4f0"/><text x="375" y="139" class="value">B</text><text x="375" y="181" class="label">Konsumfenster gestalten</text><text x="375" y="220" class="sub">Felder 3 · 4 · 5</text><rect x="682" y="105" width="285" height="148" rx="4" fill="#edf4f0"/><text x="700" y="139" class="value">C</text><text x="700" y="181" class="label">Betrieb gezielt lernen lassen</text><text x="700" y="220" class="sub">Felder 7 · 8 · 9</text><text x="32" y="295" class="value">Befund → Hypothese → kontrollierter Pilot → inkrementeller Umsatz exkl. MwSt.</text><text x="32" y="328" class="sub">Keine Rangliste nach CHF. Keine Addition überlappender Chancen. Cluberlös separat.</text><text x="32" y="362" class="sub">FCSG · Vertraulich · Datenstand 12.09.2026 · G07</text></svg>